services:
  kawarimi:
    image: kawarimi:local
    build:
      context: .
      args:
        PYTORCH_IMAGE: ${PYTORCH_IMAGE:-pytorch/pytorch:2.14.0-cuda13.0-cudnn9-runtime}
    gpus: all
    ports:
      - "8188:8188"
    environment:
      KAWARIMI_MODEL_PROFILES: ${KAWARIMI_MODEL_PROFILES:-character,motion10500,motion4500}
      KAWARIMI_MODEL_MANIFEST: /app/config/model-repos.json
      HF_TOKEN: ${HF_TOKEN:-}
      KAWARIMI_VLM_CLIP: ${KAWARIMI_VLM_CLIP:-qwen3.5_9b_w4a8_gptq.safetensors}
    volumes:
      - models:/opt/ComfyUI/models
      - state:/state
      - inputs:/opt/ComfyUI/input
      - outputs:/opt/ComfyUI/output
      - ./config/model-repos.json:/app/config/model-repos.json:ro
    shm_size: "8gb"
    init: true
    restart: unless-stopped
volumes:
  models:
  state:
  inputs:
  outputs:
